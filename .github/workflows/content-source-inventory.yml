name: Content source inventory
on:
  pull_request:
    paths: ['content/puzzles/**', 'server/editorial/**', 'scripts/audit-content-sources.*', 'tests/unit/content-sources.test.ts', '.github/workflows/content-source-inventory.yml']
  push:
    branches: [main]
    paths: ['content/puzzles/**', 'server/editorial/**', 'scripts/audit-content-sources.*', '.github/workflows/content-source-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          mkdir -p artifacts/content-sources
          node scripts/audit-content-sources.mjs > artifacts/content-sources/inventory.json
          cat artifacts/content-sources/inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-source-inventory-${{ github.run_id }}
          path: artifacts/content-sources/inventory.json
          retention-days: 14
