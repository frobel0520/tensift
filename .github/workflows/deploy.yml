name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tensift-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate puzzle content
        run: npm run validate:puzzles

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Pages artifact
        run: npm run build
        env:
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_TOP_SLOT: ${{ vars.VITE_ADSENSE_TOP_SLOT }}

      - name: Scan public bundle for answer leakage
        run: npm run scan:bundle

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name tensift --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
