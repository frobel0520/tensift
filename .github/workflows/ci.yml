name: CI

# The branching model is main plus short-lived feature branches, so every
# change reaches main through a pull request. Pushes to main are verified by
# the Deploy workflow, which runs these same gates before publishing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tensift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate puzzle content
        run: npm run validate:puzzles

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Pages artifact
        run: npm run build

      - name: Scan public bundle for answer leakage
        run: npm run scan:bundle
