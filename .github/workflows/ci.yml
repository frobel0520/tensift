name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: tensift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate puzzle content
        run: npm run validate:puzzles

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Pages artifact
        run: npm run build

      - name: Scan public bundle for answer leakage
        run: npm run scan:bundle
