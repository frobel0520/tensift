name: Daily production smoke

# Legacy daily-D1 smoke check. Scheduled cron disabled for the 300-level
# standalone edition; keep workflow_dispatch for manual runs if needed.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to smoke check'
        type: string
        required: false
        default: 'https://tensift.pages.dev'

permissions:
  contents: read

concurrency:
  group: tensift-daily-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Check the live daily release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Smoke check production
        run: node scripts/smoke-production.mjs --base-url "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.base_url || 'https://tensift.pages.dev' }}
